<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Yılan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: system-ui, sans-serif;
    color: #e2e8f0;
    gap: 12px;
  }
  header { text-align: center; }
  h1 { font-size: 1.6rem; letter-spacing: 1px; }
  .stats { display: flex; gap: 24px; font-size: 1.05rem; color: #94a3b8; }
  .stats b { color: #4ade80; }
  #board {
    background: #1e293b;
    border: 3px solid #334155;
    border-radius: 8px;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: rgba(15, 23, 42, .88);
    padding: 28px 34px;
    border-radius: 12px;
    text-align: center;
  }
  #overlay h2 { font-size: 1.3rem; }
  #overlay p { color: #94a3b8; max-width: 240px; line-height: 1.4; }
  button {
    background: #22c55e;
    color: #052e16;
    border: none;
    padding: 10px 22px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #4ade80; }
  .hidden { display: none !important; }
  .hint { color: #64748b; font-size: .85rem; }
</style>
</head>
<body>
  <header>
    <h1>🐍 Mini Yılan</h1>
    <div class="stats">
      <span>Skor: <b id="score">0</b></span>
      <span>Rekor: <b id="best">0</b></span>
    </div>
  </header>

  <div style="position:relative">
    <canvas id="board" width="480" height="480"></canvas>
    <div id="overlay">
      <h2>Mini Yılan</h2>
      <p>Yön tuşları veya WASD ile oynanır. Elma topla, duvara ve kendine çarpma!</p>
      <button id="startBtn">Başla</button>
    </div>
  </div>
  <div class="hint">Mobil: karakter tuşlarını kullan · Boşluk = duraklat</div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const grid = 20, cells = canvas.width / grid;

const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

let snake, dir, nextDir, food, score, best, speed, timer, paused;

best = Number(localStorage.getItem('snakeBest') || 0);
bestEl.textContent = best;

function reset() {
  snake = [{x: 9, y: 12}, {x: 8, y: 12}, {x: 7, y: 12}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  speed = 130;
  paused = false;
  scoreEl.textContent = score;
  placeFood();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function draw() {
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // hafif ızgara
  ctx.strokeStyle = 'rgba(51,65,85,.35)';
  ctx.lineWidth = 1;
  for (let i = 1; i < cells; i++) {
    ctx.beginPath(); ctx.moveTo(i * grid, 0); ctx.lineTo(i * grid, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * grid); ctx.lineTo(canvas.width, i * grid); ctx.stroke();
  }

  // elma
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(food.x * grid + grid / 2, food.y * grid + grid / 2, grid / 2 - 3, 0, Math.PI * 2);
  ctx.fill();

  // yılan
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? '#86efac' : '#4ade80';
    ctx.shadowColor = '#22c55e';
    ctx.shadowBlur = i === 0 ? 12 : 0;
    ctx.fillRect(seg.x * grid + 1, seg.y * grid + 1, grid - 2, grid - 2);
    ctx.shadowBlur = 0;
  });

  if (paused) {
    ctx.fillStyle = 'rgba(15,23,42,.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 28px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('DURAKLATILDI', canvas.width / 2, canvas.height / 2);
  }
}

function step() {
  if (paused) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // duvar veya kendine çarpma
  const hitWall = head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('snakeBest', best);
    }
    speed = Math.max(60, speed - 2); // yavaş yavaş hızlan
    clearInterval(timer);
    timer = setInterval(step, speed);
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver() {
  clearInterval(timer);
  draw();
  overlay.querySelector('h2').textContent = 'Oyun Bitti! 💀';
  overlay.querySelector('p').textContent = `Skorun: ${score} · Rekor: ${best}`;
  startBtn.textContent = 'Tekrar Oyna';
  overlay.classList.remove('hidden');
}

function setDir(nx, ny) {
  // 180° dönüşü engelle
  if (dir.x !== -nx || dir.y !== -ny) nextDir = {x: nx, y: ny};
}

document.addEventListener('keydown', e => {
  const key = e.key;
  if (['ArrowUp', 'w', 'W'].includes(key)) setDir(0, -1);
  else if (['ArrowDown', 's', 'S'].includes(key)) setDir(0, 1);
  else if (['ArrowLeft', 'a', 'A'].includes(key)) setDir(-1, 0);
  else if (['ArrowRight', 'd', 'D'].includes(key)) setDir(1, 0);
  else if (key === ' ') {
    e.preventDefault();
    if (timer) paused = !paused;
    draw();
  }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) e.preventDefault();
});

startBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  reset();
  draw();
  clearInterval(timer);
  timer = setInterval(step, speed);
});
</script>
</body>
</html>
